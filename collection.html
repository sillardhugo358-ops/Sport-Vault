<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collection — FOOTVAULT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="collection-fixes.css">
</head>
<body>
<div class="grain"></div>
<header class="site-header">
  <a class="brand" href="index.html"><span class="brand-mark">FV</span><span><strong>FOOTVAULT</strong><small>SPORT VAULT · FOOTBALL</small></span></a>
  <nav class="nav"><a href="index.html">Accueil</a><a class="active" href="collection.html">Collection</a><a href="album.html">Album</a><a href="packs.html">Packs</a><a href="vault.html">Mon Vault</a><a href="market.html">Market</a></nav>
  <button class="menu-btn" aria-label="Menu">☰</button>
</header>

<main class="page">
  <section class="collection-hero">
    <div>
      <p class="eyebrow">FOOTVAULT / SAISON 2026</p>
      <h1>TA <span>COLLECTION.</span></h1>
    </div>
    <div class="collection-stat"><strong id="collectionCount">00</strong><span>CARTES EN COLLECTION</span></div>
  </section>

  <section class="collection-toolbar">
    <div class="filter-group">
      <button class="filter active" data-filter="all">Toutes</button>
      <button class="filter" data-filter="common">Common</button>
      <button class="filter" data-filter="rare">Rare</button>
      <button class="filter" data-filter="epic">Epic</button>
      <button class="filter" data-filter="legendary">Legendary</button>
      <button class="filter" data-filter="icon">Ultra Rare</button>
    </div>
    <div class="collection-user" id="collectionUser">—</div>
  </section>

  <section id="collectionGrid" class="football-card-grid" aria-live="polite"></section>
  <div id="collectionState" class="collection-state" hidden></div>
</main>

<script src="app.js"></script>
<script>
const grid=document.getElementById('collectionGrid');
const count=document.getElementById('collectionCount');
const userBox=document.getElementById('collectionUser');
const state=document.getElementById('collectionState');
let cards=[];
let activeFilter='all';

function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));}
function cardHtml(card){
  const initials=card.name.split(' ').map(part=>part[0]).slice(0,2).join('');
  const classic=card.rarity!=='icon';
  return `<a class="football-card-link" href="card.html?id=${encodeURIComponent(card.instanceId)}" aria-label="Voir la fiche de ${escapeHtml(card.name)}">
    <article class="football-card rarity-${escapeHtml(card.rarity)}">
      <div class="football-card-frame">
        <div class="football-card-top"><span>FV 26</span><strong>${escapeHtml(card.position)}</strong></div>
        <div class="football-avatar"><span>${escapeHtml(initials)}</span></div>
        <div class="football-card-club">${escapeHtml(card.club)} · ${escapeHtml(card.nation)}</div>
        <h2>${escapeHtml(card.name)}</h2>
        <div class="football-card-bottom"><b>${escapeHtml(card.rarityLabel)}</b><span>${classic?'CLASSIC':escapeHtml(card.serialLabel)}</span></div>
      </div>
    </article>
  </a>`;
}
function setState(message,error=false){
  state.textContent=message;
  state.className='collection-state'+(error?' collection-state-error':'');
  state.hidden=!message;
}
function render(){
  const filtered=activeFilter==='all'?cards:cards.filter(card=>card.rarity===activeFilter);
  grid.innerHTML=filtered.map(cardHtml).join('');
  setState(filtered.length?'':'TA COLLECTION EST VIDE. OUVRE UN PACK POUR COMMENCER.');
}

document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{
  document.querySelectorAll('.filter').forEach(item=>item.classList.remove('active'));
  button.classList.add('active');
  activeFilter=button.dataset.filter;
  render();
}));

(async()=>{
  try{
    const response=await fetch('/api/collection',{credentials:'same-origin',cache:'no-store'});
    if(response.status===401){location.replace('auth.html?next=collection.html');return;}
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'Impossible de charger la collection.');
    cards=data.cards||[];
    count.textContent=String(cards.length).padStart(2,'0');
    userBox.textContent=`${data.user.name} · ${data.user.coins} FOOTCOINS · ${data.user.gems} GEMS`;
    render();
  }catch(error){
    grid.innerHTML='';
    setState(error.message,true);
  }
})();
</script>
</body>
</html>
