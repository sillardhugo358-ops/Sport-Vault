name: Logos des championnats (temporaire)
# Télécharge une fois les logos des championnats depuis Wikipédia (infobox de chaque article)
# et les ajoute au dépôt. Workflow supprimé après usage.
on:
  push:
    branches: [claude/wizardly-goldberg-4wdxqm]
    paths: ['.github/workflows/fetch-logos.yml']
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les logos choisis
        env:
          UA: "FOOTVAULT-logos/1.0 (https://sport-vault.onrender.com)"
        run: |
          api="https://en.wikipedia.org/w/api.php"
          while read -r id file; do
            url=$(curl -fsS -A "$UA" "$api?action=query&titles=File:$file&prop=imageinfo&iiprop=url&iiurlwidth=330&format=json" | jq -r '.query.pages[].imageinfo[0].thumburl')
            curl -fsS -A "$UA" -o "competition-$id.png" "$url" && echo "$id : $file -> $url" >> logos.txt
            sleep 1
          done <<'LIST'
          coupe-du-monde 2026_FIFA_World_Cup_emblem.svg
          LIST
          file competition-*.png
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competition-*.png logos.txt
          git commit -m "Logos : emblème Coupe du Monde 2026 (temporaire)" || exit 0
          git push
