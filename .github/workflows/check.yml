name: FOOTVAULT checks
# Un seul déclenchement par modification : les PR (le contrôle qui compte) et les fusions sur main ; les poussées sur une branche
# de PR ne lancent plus un second contrôle identique. Une nouvelle poussée annule le contrôle devenu inutile. Les modifications
# de documentation seule ne lancent rien.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check app.js
      - run: npm run check
      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Navigateur de test (Chromium)
        run: npx playwright-core install --with-deps chromium
      - name: Tests navigateur (ordinateur, tablette, mobile)
        run: npm run test:browser
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
