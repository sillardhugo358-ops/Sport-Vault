name: Logos des championnats (temporaire)
# Télécharge une fois les logos des championnats depuis Wikipédia (infobox de chaque article)
# et les ajoute au dépôt. Workflow supprimé après usage.
on:
  push:
    branches: [claude/wizardly-goldberg-4wdxqm]
    paths: ['.github/workflows/fetch-logos.yml']
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lister les images des articles sans logo
        env:
          UA: "FOOTVAULT-logos/1.0 (https://sport-vault.onrender.com)"
        run: |
          api="https://en.wikipedia.org/w/api.php"
          : > logos-candidats.txt
          for page in UEFA_Champions_League FIFA_World_Cup UEFA_Nations_League 2026_FIFA_World_Cup; do
            echo "== $page" >> logos-candidats.txt
            curl -fsS -A "$UA" "$api?action=parse&page=$page&prop=images&format=json&redirects=1" | jq -r '.parse.images[]' | head -40 >> logos-candidats.txt
            sleep 1
          done
          cat logos-candidats.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos-candidats.txt
          git commit -m "Logos : images candidates (temporaire)" || exit 0
          git push
