<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOOTVAULT — Hors ligne</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050b16">
<link rel="icon" type="image/svg+xml" href="footvault-icon.svg">
<style>
:root{--bg:#050b16;--panel:#0a1b32;--text:#f4f7ff;--muted:#91a8c7;--line:rgba(91,151,222,.24);--gold:#efcf7c}
@media (prefers-color-scheme:light){:root{--bg:#f4f7ff;--panel:#fff;--text:#0b1a2e;--muted:#4a5f7d;--line:rgba(11,26,46,.18);--gold:#8a6a10}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:500 16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{width:min(460px,calc(100% - 32px));padding:28px 24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:center}
h1{margin:0 0 8px;font:900 34px/1 system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase}
h1 em{font-style:normal;color:var(--gold)}
p{margin:0 0 20px;color:var(--muted)}
button{min-height:44px;min-width:44px;padding:0 24px;border:0;border-radius:10px;background:var(--gold);color:#101828;font:800 15px system-ui,sans-serif;letter-spacing:.5px;cursor:pointer}
button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>FOOT<em>VAULT</em></h1>
<h2 style="margin:0 0 10px;font-size:20px">Tu es hors ligne</h2>
<p role="status" id="msg">Ta collection et tes FOOTCOINS se chargent depuis le serveur : reconnecte-toi pour continuer. Rien n'est perdu.</p>
<button type="button" id="retry">RÉESSAYER</button>
</main>
<script>
(function(){
  var go=function(){location.reload()};
  document.getElementById('retry').addEventListener('click',go);
  addEventListener('online',go);
})();
</script>
</body>
</html>
