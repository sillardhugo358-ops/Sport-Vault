<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — FOOTVAULT</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>FOOT</span>VAULT</a><nav class="nav"><a href="index.html">Accueil</a><a href="collection.html">Collection</a><a href="album.html">Album</a><a href="packs.html">Packs</a></nav></header><main class="auth-shell"><section class="auth-card"><div class="eyebrow">FOOTVAULT / COLLECTOR</div><h1 id="title">Connexion</h1><p class="muted" id="subtitle">Retrouve ton Vault et ta collection.</p><div class="auth-tabs"><button class="active" id="loginTab">Connexion</button><button id="registerTab">Créer un compte</button></div><form id="authForm"><label id="nameWrap" hidden>Nom du collector<input id="name" autocomplete="name" maxlength="30"></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Mot de passe<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="btn btn-gold" type="submit" id="submit">Entrer dans mon Vault</button><div class="form-message" id="message"></div></form></section></main><script>let mode='login';const $=id=>document.getElementById(id);function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('registerTab').classList.toggle('active',m==='register');$('nameWrap').hidden=m==='login';$('password').autocomplete=m==='login'?'current-password':'new-password';$('title').textContent=m==='login'?'Connexion':'Créer ton Vault';$('subtitle').textContent=m==='login'?'Retrouve ton Vault et ta collection.':'Crée ton espace collector en quelques secondes.';$('submit').textContent=m==='login'?'Entrer dans mon Vault':'Créer mon compte';$('message').textContent=''}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');const params=new URLSearchParams(location.search);if(params.get('mode')==='register')setMode('register');$('authForm').onsubmit=async e=>{e.preventDefault();$('message').textContent='';const payload={email:$('email').value,password:$('password').value};if(mode==='register')payload.name=$('name').value;try{const r=await fetch('/api/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok){$('message').textContent=d.error||'Une erreur est survenue.';return}location.href='vault.html'}catch(err){$('message').textContent='Impossible de contacter le serveur.'}};fetch('/api/me').then(r=>{if(r.ok)location.href='vault.html'});</script></body></html>
