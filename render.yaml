services:
  - type: web
    name: sport-vault
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_DAYS
        value: "0.0833333333"
      # IP réelle du joueur : en-tête posé par Cloudflare devant Render, que le
      # client ne peut pas imposer (vérifié le 29/09/2026 via /api/admin/ip-debug).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Base PostgreSQL hébergée sur Aiven depuis le 29/09/2026 : la valeur se
      # saisit dans le tableau de bord Render (Service URI Aiven avec
      # ?sslmode=no-verify). Voir docs/SAUVEGARDE.md.
      - key: DATABASE_URL
        sync: false
      # Certificat de l'autorité d'Aiven (public : « CA certificate » du service) : active la
      # vérification complète du certificat de la base. Facultatif ; voir docs/SAUVEGARDE.md.
      - key: DATABASE_CA_CERT
        sync: false

# Ancienne base Render, conservée pour retour arrière jusqu'à son
# expiration le 15/10/2026. Plus utilisée par le service web.
databases:
  - name: sport-vault-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
