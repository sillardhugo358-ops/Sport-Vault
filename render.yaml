services:
  - type: web
    name: sport-vault
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sport-vault-db
          property: connectionString

databases:
  - name: sport-vault-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
