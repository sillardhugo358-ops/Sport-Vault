plugins { id 'com.android.application' }

// Signature : le fichier indiqué par FV_KEYSTORE_PROPS (storeFile, storePassword, keyAlias, keyPassword) reste hors du dépôt.
def signingFile = System.getenv('FV_KEYSTORE_PROPS') ? new File(System.getenv('FV_KEYSTORE_PROPS')) : null
def signing = new Properties()
if (signingFile != null && signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.footvault.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.footvault.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            if (signing.getProperty('storeFile')) {
                storeFile file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signing.getProperty('storeFile')) signingConfig signingConfigs.release
        }
    }
    lint { checkReleaseBuilds false }   // l'analyse « lint vital » retélécharge des dépendances hors cache : inutile pour une simple coque TWA
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
