<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPORT VAULT — Compte</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div class="grain"></div><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">SV</span><span><strong>SPORT VAULT</strong><small>COLLECT THE GAME.</small></span></a><nav class="nav"><a href="index.html">Accueil</a><a href="collection.html">Collection</a><a href="album.html">Album</a><a href="packs.html">Packs</a><a href="vault.html">Mon Vault</a><a href="market.html">Market</a></nav><div class="header-actions"><a class="btn btn-outline" href="auth.html">Connexion</a><a class="btn btn-gold" href="auth.html?mode=register">Créer un compte</a></div></header><main class="page"><section class="panel" style="max-width:560px;margin:40px auto"><p class="eyebrow">VOTRE ESPACE</p><h1 id="title" style="font:800 58px .9 var(--head);margin:0">CONNEXION.</h1><form id="form" class="stack" style="margin-top:26px"><label>Nom<input id="name" autocomplete="name" style="width:100%;height:46px;margin-top:6px;background:#080a09;border:1px solid var(--line);color:var(--text);padding:0 12px"></label><label>Email<input id="email" type="email" autocomplete="email" required style="width:100%;height:46px;margin-top:6px;background:#080a09;border:1px solid var(--line);color:var(--text);padding:0 12px"></label><label>Mot de passe<input id="password" type="password" minlength="8" required style="width:100%;height:46px;margin-top:6px;background:#080a09;border:1px solid var(--line);color:var(--text);padding:0 12px"></label><button class="btn btn-gold btn-large" id="submit">Entrer dans mon Vault</button><div id="message" style="min-height:20px;color:var(--gold2);font-size:11px"></div></form><div style="margin-top:18px"><button id="switch" class="btn btn-outline">Créer un compte</button></div></section></main><script>(async()=>{const params=new URLSearchParams(location.search);const requestedNext=params.get('next');const next=/^(?:index|collection|album|packs|vault|market|card)\.html(?:\?.*)?$/.test(requestedNext||'')?requestedNext:'vault.html';let mode=params.get('mode')==='register'?'register':'login';const $=id=>document.getElementById(id);function render(){const reg=mode==='register';$('title').textContent=reg?'CRÉER TON VAULT.':'CONNEXION.';$('name').parentElement.style.display=reg?'block':'none';$('name').required=reg;$('submit').textContent=reg?'Créer mon compte':'Entrer dans mon Vault';$('switch').textContent=reg?'J’ai déjà un compte':'Créer un compte'}$('switch').onclick=()=>{mode=mode==='register'?'login':'register';render()};$('form').onsubmit=async e=>{e.preventDefault();$('message').textContent='';const payload={email:$('email').value.trim(),password:$('password').value};if(mode==='register')payload.name=$('name').value.trim();try{const r=await fetch('/api/'+(mode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok){$('message').textContent=d.error||'Erreur.';return}location.replace(next)}catch{$('message').textContent='Serveur indisponible.'}};render()})()</script></body></html>
